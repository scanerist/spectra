name: spectra

x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-spectra: &spectra
  <<: *service
  image: ${SPECTRA_IMAGE:?set SPECTRA_IMAGE in the production environment on GitHub}
  read_only: true
  tmpfs:
    - /tmp:size=640m
  cap_drop:
    - ALL
  environment:
    SPECTRA_LOG_LEVEL: ${SPECTRA_LOG_LEVEL:-info}
    SPECTRA_LOG_FORMAT: json
    SPECTRA_MODE: hosted
    SPECTRA_FORWARDED_ALLOW_IPS: "*"
    SPECTRA_UPLOADS_PER_HOUR: ${SPECTRA_UPLOADS_PER_HOUR:-20}
    SPECTRA_NETWORK_UPLOADS_PER_HOUR: ${SPECTRA_NETWORK_UPLOADS_PER_HOUR:-60}
    SPECTRA_TOTAL_UPLOADS_PER_HOUR: ${SPECTRA_TOTAL_UPLOADS_PER_HOUR:-600}
    SPECTRA_METRICS_PORT: 9100
    SPECTRA_POSTGRES_HOST: postgres
    SPECTRA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    SPECTRA_REDIS_HOST: redis
    SPECTRA_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    SPECTRA_S3_URL: http://s3:7070
    SPECTRA_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
    SPECTRA_S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  mem_limit: ${SPECTRA_API_MEMORY_LIMIT:-2g}
  pids_limit: 256

services:
  migrate:
    <<: *spectra
    command: ["spectra-migrate"]
    restart: "no"
    networks:
      - backend
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  api:
    <<: *spectra
    networks:
      - proxy
      - backend
    stop_grace_period: 30s
    healthcheck:
      start_period: 10s
      start_interval: 2s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *spectra
    command: ["spectra-worker"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "spectra-worker-healthcheck"]
      start_period: 10s
      start_interval: 2s
    stop_grace_period: 60s
    mem_limit: ${SPECTRA_WORKER_MEMORY_LIMIT:-2g}
    pids_limit: 256
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    <<: *service
    image: ${SPECTRA_WEB_IMAGE:?set SPECTRA_WEB_IMAGE in the production environment on GitHub}
    environment:
      SPECTRA_DOMAIN: ${SPECTRA_DOMAIN:?set SPECTRA_DOMAIN in the production environment on GitHub}
    ports:
      - "${SPECTRA_HTTP_PORT:?set SPECTRA_HTTP_PORT in the production environment on GitHub}:80"
      - "${SPECTRA_HTTPS_PORT:?set SPECTRA_HTTPS_PORT in the production environment on GitHub}:443"
      - "${SPECTRA_HTTPS_PORT:?set SPECTRA_HTTPS_PORT in the production environment on GitHub}:443/udp"
    networks:
      - edge
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: ${SPECTRA_CADDY_MEMORY_LIMIT:-256m}
    pids_limit: 128
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    <<: *service
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${SPECTRA_METRICS_RETENTION:-15d}
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    networks:
      - backend
      - monitoring
    cap_drop:
      - ALL
    mem_limit: ${SPECTRA_PROMETHEUS_MEMORY_LIMIT:-512m}
    pids_limit: 128
    volumes:
      - prometheus:/prometheus

  grafana:
    <<: *service
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/spectra.json
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/spectra.yaml
      - source: grafana-dashboards
        target: /etc/grafana/provisioning/dashboards/spectra.yaml
      - source: grafana-spectra-dashboard
        target: /etc/grafana/dashboards/spectra.json
    ports:
      - "${SPECTRA_GRAFANA_BIND_ADDRESS:?set SPECTRA_GRAFANA_BIND_ADDRESS in the production environment on GitHub}:${SPECTRA_GRAFANA_PORT:?set SPECTRA_GRAFANA_PORT in the production environment on GitHub}:3000"
    networks:
      - monitoring
    cap_drop:
      - ALL
    mem_limit: ${SPECTRA_GRAFANA_MEMORY_LIMIT:-384m}
    pids_limit: 128
    volumes:
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus

  postgres:
    <<: *service
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: spectra
      POSTGRES_USER: spectra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    networks:
      - backend
    mem_limit: ${SPECTRA_POSTGRES_MEMORY_LIMIT:-512m}
    pids_limit: 256
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=spectra --dbname=spectra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *service
    image: redis:8.8.3-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    networks:
      - backend
    mem_limit: ${SPECTRA_REDIS_MEMORY_LIMIT:-256m}
    pids_limit: 128
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    <<: *service
    image: versity/versitygw:v1.8.0
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_IAM_DIR: /data/iam
      VGW_PORT: ":7070"
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:?}
    networks:
      - backend
    cap_drop:
      - ALL
    mem_limit: ${SPECTRA_S3_MEMORY_LIMIT:-512m}
    pids_limit: 128
    volumes:
      - s3-objects:/data/s3
      - s3-iam:/data/iam
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:7070/ 2>&1 | grep -q HTTP/"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  edge:
    enable_ipv6: true
  proxy:
    internal: true
  backend:
    internal: true
  monitoring:

volumes:
  postgres:
  redis:
  s3-objects:
  s3-iam:
  caddy-data:
  caddy-config:
  prometheus:
  grafana:

configs:
  prometheus:
    file: ./deploy/prometheus/prometheus.yml
  grafana-datasources:
    file: ./deploy/grafana/provisioning/datasources/spectra.yaml
  grafana-dashboards:
    file: ./deploy/grafana/provisioning/dashboards/spectra.yaml
  grafana-spectra-dashboard:
    file: ./deploy/grafana/dashboards/spectra.json
