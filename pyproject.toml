[project]
name = "spectra"
version = "0.1.0"
description = "Audio-reactive visualizer for techno: a real-time Python engine streaming features to a browser renderer"
authors = [
    { name = "MANOGER", email = "aliyevm28@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "msgpack>=1.2.3",
    "numpy>=2.5.3",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
spectra = "spectra.bootstrap.app:run"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["src/spectra/legacy", "tests/legacy"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "CPY001", "TRY003", "EM101", "EM102", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001", "SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["spectra", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
mypy_path = ["src", "."]
explicit_package_bases = true
exclude = ["^src/spectra/legacy/", "^tests/legacy/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["msgpack"]
ignore_missing_imports = true

[tool.pytest]
minversion = "9.0"
strict = true
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
pythonpath = ["."]

[tool.importlinter]
root_package = "spectra"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Top-level layering"
type = "layers"
layers = ["spectra.bootstrap", "spectra.gateway", "spectra.analysis", "spectra.shared"]

[[tool.importlinter.contracts]]
name = "Analysis context layering"
type = "layers"
containers = ["spectra.analysis"]
layers = ["adapters", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Analysis domain stays pure"
type = "forbidden"
source_modules = ["spectra.analysis.domain"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "pydantic", "pydantic_settings", "msgpack"]

[[tool.importlinter.contracts]]
name = "Gateway does not know concrete adapters"
type = "forbidden"
source_modules = ["spectra.gateway"]
forbidden_modules = ["spectra.analysis.adapters"]
