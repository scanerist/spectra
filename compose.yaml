name: spectra

services:
  api:
    build: .
    image: spectra:local
    restart: unless-stopped
    environment:
      SPECTRA_LOG_LEVEL: ${SPECTRA_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${SPECTRA_API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      start_period: 10s
      start_interval: 2s

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spectra
      POSTGRES_USER: spectra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=spectra --dbname=spectra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: versity/versitygw:v1.8.0
    restart: unless-stopped
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_IAM_DIR: /data/iam
      VGW_PORT: ":7070"
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - s3-objects:/data/s3
      - s3-iam:/data/iam

volumes:
  postgres:
  redis:
  s3-objects:
  s3-iam:
