global:
  scrape_interval: 15s
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9100"]
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 15s
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
