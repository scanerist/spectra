name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen mypy
      - run: uv run --frozen lint-imports

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: spectra:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: cp .env.example .env
      - run: docker compose up --detach --wait --no-build
      - run: test "$(docker compose exec -T api id -u)" = 10001
      - run: docker compose exec -T api spectra-smoke
      - run: docker compose exec -T api python -c "import http.client; c = http.client.HTTPConnection('s3', 7070, timeout=10); c.request('GET', '/'); c.getresponse()"
      - if: failure()
        run: docker compose logs
