name: spectra

x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *service
    image: ${SPECTRA_IMAGE:?set SPECTRA_IMAGE in the production environment on GitHub}
    environment:
      SPECTRA_LOG_LEVEL: ${SPECTRA_LOG_LEVEL:-info}
    ports:
      - "${SPECTRA_BIND_ADDRESS:?set SPECTRA_BIND_ADDRESS in the production environment on GitHub}:${SPECTRA_API_PORT:?set SPECTRA_API_PORT in the production environment on GitHub}:8000"
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: ${SPECTRA_API_MEMORY_LIMIT:-2g}
    pids_limit: 256
    healthcheck:
      start_period: 10s
      start_interval: 2s

  postgres:
    <<: *service
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: spectra
      POSTGRES_USER: spectra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the production environment on GitHub}
    networks:
      - backend
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=spectra --dbname=spectra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *service
    image: redis:8.8.3-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in the production environment on GitHub}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the production environment on GitHub}
    networks:
      - backend
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    <<: *service
    image: versity/versitygw:v1.8.0
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_IAM_DIR: /data/iam
      VGW_PORT: ":7070"
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in the production environment on GitHub}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in the production environment on GitHub}
    networks:
      - backend
    volumes:
      - s3-objects:/data/s3
      - s3-iam:/data/iam

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres:
  redis:
  s3-objects:
  s3-iam:
