name: spectra

x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-spectra: &spectra
  <<: *service
  image: spectra:local
  build: .
  read_only: true
  tmpfs:
    - /tmp:size=640m
  cap_drop:
    - ALL
  environment:
    SPECTRA_LOG_LEVEL: ${SPECTRA_LOG_LEVEL:-info}
    SPECTRA_MODE: hosted
    SPECTRA_METRICS_PORT: 9100
    SPECTRA_POSTGRES_HOST: postgres
    SPECTRA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    SPECTRA_REDIS_HOST: redis
    SPECTRA_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    SPECTRA_S3_URL: http://s3:7070
    SPECTRA_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
    SPECTRA_S3_SECRET_KEY: ${S3_SECRET_KEY:?}

services:
  migrate:
    <<: *spectra
    command: ["spectra-migrate"]
    restart: "no"
    networks:
      - backend
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  api:
    <<: *spectra
    ports:
      - "${SPECTRA_BIND_ADDRESS:?set SPECTRA_BIND_ADDRESS in .env}:${SPECTRA_API_PORT:?set SPECTRA_API_PORT in .env}:8000"
    networks:
      - edge
      - backend
    healthcheck:
      start_period: 10s
      start_interval: 2s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *spectra
    command: ["spectra-worker"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "spectra-worker-healthcheck"]
      start_period: 10s
      start_interval: 2s
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    <<: *service
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: spectra
      POSTGRES_USER: spectra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    networks:
      - backend
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=spectra --dbname=spectra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *service
    image: redis:8.8.3-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    networks:
      - backend
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    <<: *service
    image: versity/versitygw:v1.8.0
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_IAM_DIR: /data/iam
      VGW_PORT: ":7070"
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:?}
    networks:
      - backend
    volumes:
      - s3-objects:/data/s3
      - s3-iam:/data/iam
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:7070/ 2>&1 | grep -q HTTP/"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres:
  redis:
  s3-objects:
  s3-iam:
