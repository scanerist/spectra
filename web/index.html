<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Закинь трек — spectra разберёт его на частоты, найдёт темп и структуру." />
    <title>spectra</title>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="l">
          <a class="word" href="#start" id="home">spectra</a>
          <a class="btn bare" href="#main" id="back" aria-label="Назад к визуализации" hidden>←</a>
        </div>
        <div class="r">
          <span id="clock" class="mut" hidden>0:00 / 0:00</span>
          <button class="btn" id="play" type="button" aria-label="Пауза" hidden>
            <svg class="ico" id="icon-pause" viewBox="0 0 7 7" aria-hidden="true"><rect x="1" y="0" width="2" height="7" /><rect x="4" y="0" width="2" height="7" /></svg>
            <svg class="ico" id="icon-play" viewBox="0 0 7 7" aria-hidden="true" hidden><rect x="1" y="0" width="1" height="7" /><rect x="2" y="1" width="1" height="5" /><rect x="3" y="2" width="1" height="3" /><rect x="4" y="3" width="1" height="1" /></svg>
          </button>
          <a class="btn bare" id="repo" href="#start" hidden>github</a>
        </div>
      </header>

      <section class="screen" id="s-start" hidden>
        <div class="start">
          <div class="hero">
            <h1>закинь трек.</h1>
            <div class="cv" aria-hidden="true"><canvas id="c-hero"></canvas></div>
          </div>
          <div class="dropcol">
            <label class="drop" id="drop" for="file">
              <span class="k tl"></span><span class="k tr"></span><span class="k bl"></span><span class="k br"></span>
              <span>перетащи файл</span>
              <input type="file" id="file" accept="audio/*,.mp3,.wav,.flac,.ogg,.oga" />
            </label>
            <p class="err" id="file-error" role="alert" hidden></p>
            <div class="dropfoot">
              <span class="mut">mp3 wav flac ogg</span>
            </div>
          </div>
        </div>
      </section>

      <section class="screen" id="s-loading" hidden>
        <div class="load" role="status" aria-live="polite">
          <p class="big">разбираю на частоты</p>
          <div class="blocks" id="blocks" aria-hidden="true"></div>
          <p class="mut" id="stage">читаю файл</p>
        </div>
      </section>

      <section class="screen" id="s-main" hidden>
        <div class="stage">
          <div class="vis" role="img" aria-label="Спектр трека во времени">
            <div class="cv fill"><canvas id="c-ridge"></canvas></div>
            <div class="scan"></div>
            <span class="k tl"></span><span class="k tr"></span><span class="k bl"></span><span class="k br"></span>
            <div class="beats" id="beats" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            <button class="btn acc unmute" id="unmute" type="button" hidden>звук</button>
          </div>
        </div>
        <div class="trio" aria-hidden="true">
          <div class="cv"><canvas id="c-signal"></canvas></div>
          <div class="cv"><canvas id="c-decomposition"></canvas></div>
          <div class="cv"><canvas id="c-spectrum"></canvas></div>
        </div>
        <div class="strip" id="sections" role="slider" tabindex="0" aria-label="Позиция в треке" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="head" id="playhead"></div>
        </div>
        <div class="bar"><a class="btn" href="#analysis">разбор</a></div>
      </section>

      <section class="screen" id="s-analysis" hidden>
        <div class="vis wire" role="img" aria-label="Каркас спектра: история спектра как проволочный рельеф">
          <div class="cv fill"><canvas id="c-wire"></canvas></div>
          <span class="k tl"></span><span class="k tr"></span>
        </div>
        <div class="trio" aria-hidden="true">
          <div class="cv"><canvas id="c-epicycles"></canvas></div>
          <div class="cv"><canvas id="c-winding"></canvas></div>
          <div class="cv"><canvas id="c-magnitude"></canvas></div>
        </div>
      </section>
    </div>
    <canvas id="dissolve" hidden aria-hidden="true"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
