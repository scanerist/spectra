name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      SPECTRA_DOMAIN: ${{ vars.SPECTRA_DOMAIN }}
      SPECTRA_HTTP_PORT: ${{ vars.SPECTRA_HTTP_PORT }}
      SPECTRA_HTTPS_PORT: ${{ vars.SPECTRA_HTTPS_PORT }}
    steps:
      - name: deploy only release tags
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::deploy runs only from a v* tag, got $GITHUB_REF"
            exit 1
          fi
      - name: check deployment settings
        run: |
          for name in DEPLOY_HOST DEPLOY_USER SPECTRA_DOMAIN SPECTRA_HTTP_PORT SPECTRA_HTTPS_PORT; do
            if [ -z "${!name}" ]; then
              echo "::error::set $name in the production environment variables"
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          echo "SPECTRA_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SPECTRA_WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/web:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.SPECTRA_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          push: true
          tags: ${{ env.SPECTRA_WEB_IMAGE }}
          build-args: VITE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: configure ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host spectra\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  BatchMode yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
      - name: check docker compose on the server
        run: |
          version=$(ssh spectra 'docker compose version --short')
          version="${version#v}"
          if [ "$(printf '%s\n' 2.24.4 "$version" | sort -V | head -n 1)" != 2.24.4 ]; then
            echo "::error::the compose files need docker compose 2.24.4 or newer, the server has $version"
            exit 1
          fi
      - name: upload compose files, monitoring configs and environment
        env:
          SPECTRA_LOG_LEVEL: ${{ vars.SPECTRA_LOG_LEVEL }}
          SPECTRA_API_MEMORY_LIMIT: ${{ vars.SPECTRA_API_MEMORY_LIMIT }}
          SPECTRA_WORKER_MEMORY_LIMIT: ${{ vars.SPECTRA_WORKER_MEMORY_LIMIT }}
          SPECTRA_UPLOADS_PER_HOUR: ${{ vars.SPECTRA_UPLOADS_PER_HOUR }}
          SPECTRA_NETWORK_UPLOADS_PER_HOUR: ${{ vars.SPECTRA_NETWORK_UPLOADS_PER_HOUR }}
          SPECTRA_TOTAL_UPLOADS_PER_HOUR: ${{ vars.SPECTRA_TOTAL_UPLOADS_PER_HOUR }}
          SPECTRA_GRAFANA_BIND_ADDRESS: ${{ vars.SPECTRA_GRAFANA_BIND_ADDRESS }}
          SPECTRA_GRAFANA_PORT: ${{ vars.SPECTRA_GRAFANA_PORT }}
          SPECTRA_METRICS_RETENTION: ${{ vars.SPECTRA_METRICS_RETENTION }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          environment_file="$RUNNER_TEMP/spectra.env"
          install -m 600 /dev/null "$environment_file"
          echo 'COMPOSE_FILE=compose.yaml:compose.hosted.yaml:compose.prod.yaml' >> "$environment_file"
          echo 'COMPOSE_PROFILES=monitoring' >> "$environment_file"
          for name in SPECTRA_IMAGE SPECTRA_WEB_IMAGE SPECTRA_DOMAIN SPECTRA_HTTP_PORT SPECTRA_HTTPS_PORT \
            SPECTRA_LOG_LEVEL SPECTRA_API_MEMORY_LIMIT SPECTRA_WORKER_MEMORY_LIMIT SPECTRA_UPLOADS_PER_HOUR \
            SPECTRA_NETWORK_UPLOADS_PER_HOUR SPECTRA_TOTAL_UPLOADS_PER_HOUR \
            SPECTRA_GRAFANA_BIND_ADDRESS SPECTRA_GRAFANA_PORT SPECTRA_METRICS_RETENTION GRAFANA_ADMIN_PASSWORD \
            POSTGRES_PASSWORD REDIS_PASSWORD S3_ACCESS_KEY S3_SECRET_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              continue
            fi
            case "$value" in
              *"'"* | *$'\n'*)
                echo "::error::$name must not contain quotes or line breaks"
                exit 1
                ;;
            esac
            printf "%s='%s'\n" "$name" "$value" >> "$environment_file"
          done
          ssh spectra 'mkdir -p spectra && rm -rf spectra/.release && mkdir spectra/.release'
          scp compose.yaml compose.hosted.yaml compose.prod.yaml spectra:spectra/.release/
          scp -r deploy spectra:spectra/.release/
          ssh spectra 'umask 077 && cat > spectra/.release/.env' < "$environment_file"
          rm "$environment_file"
          ssh spectra 'cd spectra && rm -rf deploy && mv .release/compose.yaml .release/compose.hosted.yaml .release/compose.prod.yaml .release/deploy .release/.env . && rmdir .release'
      - name: pull and start
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          if [[ ! "$REGISTRY_USER" =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]]; then
            echo "::error::unexpected actor name"
            exit 1
          fi
          printf '%s' "$REGISTRY_TOKEN" | ssh spectra "docker login ghcr.io --username '$REGISTRY_USER' --password-stdin"
          ssh spectra 'cd spectra && docker compose pull && docker compose up --detach --wait --remove-orphans'
      - name: smoke test
        run: ssh spectra 'cd spectra && docker compose exec -T api spectra-smoke'
      - name: check the public endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "https://$SPECTRA_DOMAIN/health"
      - name: show which services failed
        if: failure()
        run: ssh spectra 'cd spectra && docker compose ps --all --format "{{.Service}} {{.State}} {{.Health}}"'
      - name: remove the deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/.ssh/config
