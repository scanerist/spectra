name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen mypy
      - run: uv run --frozen lint-imports

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check

  adapters:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: spectra_test
          POSTGRES_USER: spectra
          POSTGRES_PASSWORD: spectra-test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready --username=spectra --dbname=spectra_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8.8.3-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      SPECTRA_TEST_DATABASE_URL: postgresql+asyncpg://spectra:spectra-test@127.0.0.1:5432/spectra_test
      SPECTRA_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      SPECTRA_TEST_S3_URL: http://127.0.0.1:7070
      SPECTRA_TEST_S3_ACCESS_KEY: spectra
      SPECTRA_TEST_S3_SECRET_KEY: spectra-test-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Start versitygw
        run: |
          docker run --detach --name s3 \
            --publish 127.0.0.1:7070:7070 \
            --volume s3-objects:/data/s3 \
            --volume s3-iam:/data/iam \
            --env VGW_BACKEND=posix \
            --env VGW_BACKEND_ARGS=/data/s3 \
            --env VGW_IAM_DIR=/data/iam \
            --env VGW_PORT=:7070 \
            --env ROOT_ACCESS_KEY="$SPECTRA_TEST_S3_ACCESS_KEY" \
            --env ROOT_SECRET_KEY="$SPECTRA_TEST_S3_SECRET_KEY" \
            versity/versitygw:v1.8.0
          for _ in $(seq 30); do
            curl --silent --output /dev/null http://127.0.0.1:7070/ && exit 0
            sleep 1
          done
          docker logs s3
          exit 1
      - run: uv sync --frozen
      - run: uv run --frozen pytest tests/integration
      - if: failure()
        run: docker logs s3

  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: spectra:local
          cache-from: type=gha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          load: true
          tags: spectra-web:local
          cache-from: type=gha,scope=web
      - run: docker compose -f compose.yaml up --detach --wait
      - name: check that the local stack serves the web client and the engine
        run: |
          curl --fail --silent --show-error http://localhost:8080/ | grep -q '<title>spectra</title>'
          curl --fail --silent --show-error http://localhost:8080/health | jq --exit-status '.protocol == 1'
      - if: failure()
        run: |
          docker compose -f compose.yaml ps --all
          docker compose -f compose.yaml logs

  image:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.hosted.yaml:compose.prod.yaml
      COMPOSE_PROFILES: monitoring
      SPECTRA_IMAGE: spectra:local
      SPECTRA_WEB_IMAGE: spectra-web:local
      SPECTRA_DOMAIN: localhost
      SPECTRA_HTTP_PORT: 8080
      SPECTRA_HTTPS_PORT: 8443
      SPECTRA_GRAFANA_BIND_ADDRESS: 127.0.0.1
      SPECTRA_GRAFANA_PORT: 3000
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      S3_ACCESS_KEY: spectra
      S3_SECRET_KEY: ci-s3-secret-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: spectra:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          load: true
          tags: spectra-web:local
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - run: docker compose --file compose.yaml config --quiet
      - run: docker compose up --detach --wait 2>&1 | tee "$RUNNER_TEMP/up.log"
        shell: bash
      - run: test "$(docker compose exec -T api id -u)" = 10001
      - run: docker compose exec -T api spectra-smoke
      - run: test "$(docker compose ps --quiet --status running worker)" != ""
      - name: check that caddy proxies the engine with its headers and keeps readiness inside
        shell: bash
        run: |
          curl --fail --silent --show-error --insecure --dump-header - --output /dev/null https://localhost:8443/health | grep -qi '^permissions-policy:'
          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' https://localhost:8443/ready)" = 404
      - name: check that caddy serves the web client
        run: |
          curl --fail --silent --show-error --insecure https://localhost:8443/ | grep -q '<title>spectra</title>'
          curl --fail --silent --show-error --insecure --head https://localhost:8443/ | grep -qi '^content-security-policy:'
      - name: check that prometheus scrapes every target
        run: |
          query='http://localhost:9090/api/v1/query?query=min(up)'
          for _ in $(seq 30); do
            if docker compose exec -T prometheus wget -qO- "$query" | grep -q '"1"\]'; then
              exit 0
            fi
            sleep 2
          done
          docker compose exec -T prometheus wget -qO- 'http://localhost:9090/api/v1/targets'
          exit 1
      - name: check that grafana has the dashboard
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --retry 10 --retry-delay 3 --retry-all-errors
          --user "admin:$GRAFANA_ADMIN_PASSWORD"
          http://127.0.0.1:3000/api/dashboards/uid/spectra
      - name: show why the stack failed
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs
          if [ -s "$RUNNER_TEMP/up.log" ]; then
            reason=$(grep -v -e 'Pull' -e 'Extracting' -e 'Downloading' -e 'Waiting' "$RUNNER_TEMP/up.log" | tail -n 15 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=docker compose up failed::$reason"
          fi
          docker compose ps --all --format '{{.Service}} {{.State}} {{.Health}}' |
            awk '$2 != "running" || ($3 != "" && $3 != "healthy") { print $1 }' |
            while read -r service; do
              tail=$(docker compose logs --no-color --tail 30 "$service" 2>&1 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')
              echo "::error title=$service is not running or healthy::$tail"
            done
