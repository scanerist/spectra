name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      SPECTRA_DOMAIN: ${{ vars.SPECTRA_DOMAIN }}
      SPECTRA_HTTP_PORT: ${{ vars.SPECTRA_HTTP_PORT }}
      SPECTRA_HTTPS_PORT: ${{ vars.SPECTRA_HTTPS_PORT }}
    steps:
      - name: check deployment settings
        run: |
          for name in DEPLOY_HOST DEPLOY_USER SPECTRA_DOMAIN SPECTRA_HTTP_PORT SPECTRA_HTTPS_PORT; do
            if [ -z "${!name}" ]; then
              echo "::error::set $name in the production environment variables"
              exit 1
            fi
          done
      - uses: actions/checkout@v7
      - run: echo "SPECTRA_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.SPECTRA_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: configure ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host spectra\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  BatchMode yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
      - name: upload compose file and environment
        env:
          SPECTRA_LOG_LEVEL: ${{ vars.SPECTRA_LOG_LEVEL }}
          SPECTRA_API_MEMORY_LIMIT: ${{ vars.SPECTRA_API_MEMORY_LIMIT }}
          SPECTRA_WORKER_MEMORY_LIMIT: ${{ vars.SPECTRA_WORKER_MEMORY_LIMIT }}
          SPECTRA_UPLOADS_PER_HOUR: ${{ vars.SPECTRA_UPLOADS_PER_HOUR }}
          SPECTRA_GRAFANA_BIND_ADDRESS: ${{ vars.SPECTRA_GRAFANA_BIND_ADDRESS }}
          SPECTRA_GRAFANA_PORT: ${{ vars.SPECTRA_GRAFANA_PORT }}
          SPECTRA_METRICS_RETENTION: ${{ vars.SPECTRA_METRICS_RETENTION }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          environment_file="$RUNNER_TEMP/spectra.env"
          install -m 600 /dev/null "$environment_file"
          for name in SPECTRA_IMAGE SPECTRA_DOMAIN SPECTRA_HTTP_PORT SPECTRA_HTTPS_PORT \
            SPECTRA_LOG_LEVEL SPECTRA_API_MEMORY_LIMIT SPECTRA_WORKER_MEMORY_LIMIT SPECTRA_UPLOADS_PER_HOUR \
            SPECTRA_GRAFANA_BIND_ADDRESS SPECTRA_GRAFANA_PORT SPECTRA_METRICS_RETENTION GRAFANA_ADMIN_PASSWORD \
            POSTGRES_PASSWORD REDIS_PASSWORD S3_ACCESS_KEY S3_SECRET_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              continue
            fi
            case "$value" in
              *"'"* | *$'\n'*)
                echo "::error::$name must not contain quotes or line breaks"
                exit 1
                ;;
            esac
            printf "%s='%s'\n" "$name" "$value" >> "$environment_file"
          done
          ssh spectra 'mkdir -p spectra'
          scp compose.prod.yaml spectra:spectra/compose.yaml
          ssh spectra 'umask 077 && cat > spectra/.env.next && mv spectra/.env.next spectra/.env' < "$environment_file"
          rm "$environment_file"
      - name: pull and start
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh spectra 'docker login ghcr.io --username ${{ github.actor }} --password-stdin'
          ssh spectra 'cd spectra && docker compose pull && docker compose up --detach --wait --remove-orphans'
      - name: smoke test
        run: ssh spectra 'cd spectra && docker compose exec -T api spectra-smoke'
      - name: check the public endpoint
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "https://$SPECTRA_DOMAIN/ready"
      - if: failure()
        run: ssh spectra 'cd spectra && docker compose ps && docker compose logs --tail 200'
