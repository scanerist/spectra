name: spectra

x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *service
    image: spectra:local
    build: .
    read_only: true
    tmpfs:
      - /tmp:size=640m
    cap_drop:
      - ALL
    environment:
      SPECTRA_LOG_LEVEL: ${SPECTRA_LOG_LEVEL:-info}
      SPECTRA_MODE: local
    healthcheck:
      start_period: 10s
      start_interval: 2s

  web:
    <<: *service
    image: spectra-web:local
    build: ./web
    environment:
      SPECTRA_DOMAIN: http://localhost
    ports:
      - "127.0.0.1:${SPECTRA_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
